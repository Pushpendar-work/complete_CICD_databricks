# This is a Declarative Automation Bundle definition for bakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse
  uuid: 09f758af-2537-419a-82f6-bdc9bb85fc9d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1fc97abe-1f5c.cloud.databricks.com
    variables:
      catalog: bakehouse_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-1fc97abe-1f5c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pushpendar.work@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pushpendar.work@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_prod
      schema: prod
    permissions:
      - user_name: pushpendar.work@gmail.com
        level: CAN_MANAGE
